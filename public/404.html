<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Seite nicht gefunden | MINO Consulting KG</title>
    <style>
      :root{--gutter:clamp(1.25rem,6.25vw,5rem);--header:4.5rem;color:#0a1c1a;background:#deece6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px}.shell{width:100%;max-width:calc(76rem + var(--gutter)*2);margin-inline:auto;padding-inline:var(--gutter)}.header{border-bottom:1px solid rgba(10,28,26,.5);background:#fff}.header .shell{display:flex;align-items:center;min-height:var(--header)}.logo{display:block;width:clamp(6.75rem,20vw,9rem);height:auto}.main{display:grid;align-content:center;min-height:calc(100vh - var(--header));min-height:calc(100dvh - var(--header));padding-block:clamp(3.5rem,8vw,8rem)}.panel{position:relative;max-width:48rem;border:1px solid rgba(10,28,26,.5);border-radius:.4rem;background:rgba(255,255,255,.55);padding:clamp(1.5rem,4vw,3rem);box-shadow:8px 8px 0 rgba(10,28,26,.08)}.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.line{width:4rem;height:3px;margin-block:1.25rem;background:#b86a64}h1,.hr-heading{max-width:13ch;margin:0;font-family:Georgia,serif;font-size:clamp(2.4rem,8vw,4.5rem);line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}.hr-heading{margin-top:1rem;font-size:clamp(1.7rem,5vw,2.75rem);font-style:italic}p{max-width:62ch;margin-block:1.5rem 0;font-size:1.1rem;line-height:1.65;text-wrap:pretty}.links{display:grid;gap:.75rem 1.5rem;margin-top:2rem}@media(min-width:700px){.links{grid-template-columns:1fr 1fr}}a{display:inline-flex;min-height:2.8rem;align-items:center;color:#0a1c1a;font-weight:700;text-underline-offset:.25rem}a:focus-visible{outline:3px solid #b86a64;outline-offset:3px}
    </style>
  </head>
  <body>
    <header class="header"><div class="shell"><a href="./" aria-label="MINO Consulting KG – Startseite"><img class="logo" src="./brand/mino-logo.svg" width="344" height="143" alt="MINO Consulting KG" /></a></div></header>
    <main class="main shell">
      <section class="panel">
        <span class="eyebrow">MINO Consulting KG</span>
        <div class="line" aria-hidden="true"></div>
        <h1>Seite nicht gefunden</h1>
        <p class="hr-heading" lang="hr">Stranica nije pronađena</p>
        <p>Die gewünschte Seite ist nicht verfügbar. Odaberite početnu stranicu ili kontakt na željenom jeziku.</p>
        <nav class="links" aria-label="Seiten zur weiteren Navigation">
          <a href="./">Deutsche Startseite</a>
          <a href="./hr/" lang="hr">Hrvatska početna stranica</a>
          <a href="./#contact">Kontakt auf Deutsch</a>
          <a href="./hr/#contact" lang="hr">Kontakt na hrvatskom</a>
        </nav>
      </section>
    </main>
  </body>
</html>
